<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <!-- NexPlay Games - Startup placeholder logo -->
  <defs>
    <linearGradient id="np-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C3CE0"/>
      <stop offset="100%" style="stop-color:#00C9DB"/>
    </linearGradient>
  </defs>
  <!-- Rounded rectangle background -->
  <rect x="4" y="4" width="52" height="52" rx="12" fill="url(#np-grad)"/>
  <!-- Play triangle icon -->
  <polygon points="22,16 22,44 44,30" fill="#FFFFFF" opacity="0.9"/>
  <!-- "N" letterform integrated into play button -->
  <path d="M20,18 L20,42 L24,42 L24,26 L32,42 L36,42 L36,18 L32,18 L32,34 L24,18 Z" fill="#FFFFFF" opacity="0.3"/>
  <!-- Wordmark -->
  <text x="66" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#2D2D3F" letter-spacing="-0.3">
    <tspan fill="#6C3CE0">Nex</tspan><tspan fill="#2D2D3F">Play</tspan>
  </text>
  <text x="66" y="48" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#888" letter-spacing="3">
    GAMES
  </text>
</svg>
